<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tüm Etkinlikler</title>
  <link rel="stylesheet" href="css/2416501044.css">
  <script type="module" src="js/event-list.js"></script>
</head>
<body>
  <header>
    <h1>Tüm Etkinlikler</h1>
    <nav aria-label="Ana menü">
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="filtre-baslik">
      <h2 id="filtre-baslik">Etkinlikleri ara ve filtrele</h2>

      <form id="filtre-formu" class="filtre">
        <div>
          <label for="arama">Etkinlik ara</label>
          <input type="search" id="arama" placeholder="atölye, kariyer...">
        </div>

        <div>
          <label for="kategori-filtre">Kategori</label>
          <select id="kategori-filtre">
            <option value="">Tümü</option>
          </select>
        </div>
      </form>

      <p id="sonuc" aria-live="polite">6 etkinlik listeleniyor.</p>
      <div id="etkinlik-listesi" class="etkinlik-listesi"></div>
    </section>
  </main>

  <footer>
    <p>Işıkhan IŞIK · 2026</p>
  </footer>
</body>
</html>
