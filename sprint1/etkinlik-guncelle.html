<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <p>
                <label for="etkinlik-adi">Etkinlik Adı</label><br>
                <input type="text" id="etkinlik-adi" name="etkinlik_adi"
                       value="Kariyer Günleri" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="kariyer">Kariyer</option>
                    <option value="diger">Diğer</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih</label><br>
                <input type="text" id="tarih" name="tarih"
                       value="12.10.2026" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="5" cols="40" required>Mezun söyleşileri</textarea>
            </p>

            <button type="submit">Güncelle</button>
        </form>
    </main>
</body>
</html>
