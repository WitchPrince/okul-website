<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501044.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
    <nav aria-label="Ana menü">
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <form id="etkinlik-formu" class="form" novalidate>
      <p>Yeni etkinliğin bilgilerini girin.</p>
      
<div class="form-alani">
  <label for="ad">Etkinlik adı</label>
  <input type="text" id="ad" name="ad">
  <span class="hata" id="ad-hata" aria-live="polite"></span>
</div>

<div class="form-alani">
  <label for="kategori">Kategori</label>
  <select id="kategori" name="kategori">
    <option value="">Seçiniz</option>
    <option value="Seminer">Seminer</option>
    <option value="Atölye">Atölye</option>
    <option value="Söyleşi">Söyleşi</option>
  </select>
  <span class="hata" id="kategori-hata" aria-live="polite"></span>
</div>

<div class="form-alani">
  <label for="tarih">Tarih</label>
  <input type="text" id="tarih" name="tarih" placeholder="GG-AA-YYYY">
  <span class="hata" id="tarih-hata" aria-live="polite"></span>
</div>

<div class="form-alani">
  <label for="saat">Saat</label>
  <input type="time" id="saat" name="saat">
  <span class="hata" id="saat-hata" aria-live="polite"></span>
</div>

<div class="form-alani">
  <label for="yer">Yer</label>
  <input type="text" id="yer" name="yer">
  <span class="hata" id="yer-hata" aria-live="polite"></span>
</div>

<div class="form-alani">
  <label for="kontenjan">Kontenjan</label>
  <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
  <span class="hata" id="kontenjan-hata" aria-live="polite"></span>
</div>

<div class="form-alani">
  <label for="aciklama">Açıklama</label>
  <textarea id="aciklama" name="aciklama" rows="5"></textarea>
  <span class="hata" id="aciklama-hata" aria-live="polite"></span>
</div>

      <button type="submit">Kaydet</button>
      <div id="form-mesaj" aria-live="polite"></div>
    </form>
  </main>

  <footer>
    <p>Işıkhan IŞIK · 2026</p>
  </footer>
</body>
</html>
